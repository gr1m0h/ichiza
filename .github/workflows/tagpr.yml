# This workflow is managed by gh actions-lock.

name: tagpr

# Maintains a release PR on every push to main. Merging that PR creates the
# next semver tag and publishes its GitHub Release.
#
# Bump kind is controlled by labels on merged PRs:
#   minor / major (default: patch).

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: write
    steps:
      - uses: cicd-sensor/cicd-sensor-action@v0.0.39
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Songmu/tagpr@v1.21.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
