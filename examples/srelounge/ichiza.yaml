# SRE Lounge Hiroshima の要件を設定だけで再現する例。
# ハイブリッド既定・4人体制の役割・StreamYard/YouTube・スマホ+GoPro撮影。
lifecycle: examples/srelounge/lifecycle.yaml
events_dir: events
defaults:
  mode: hybrid
  venue:
    capacity: 30
    facilities: [wifi, projector, hdmi]
    checkin: 顔パス
  roles: [mc, reception, timekeeper]
  streaming_role: streaming
  streaming:
    platform: streamyard
    camera: [smartphone, gopro]
  timetable:
    - { start: "19:00", title: オープニング }
notifier:
  type: slack
registry:
  type: connpass
sns:
  x:
    mode: intent
