name: ichiza web deploy
description: Deploy the shared ichiza Web cockpit to a community Cloudflare Worker
inputs:
  worker-name:
    description: Cloudflare Worker name
    required: true
  repository:
    description: GitHub repository in owner/repository form (default is the current repository)
    default: ""
  members:
    description: JSON array of allowed operators with email and github fields
    default: "[]"
  timezone:
    description: IANA timezone used for due-date status
    default: Asia/Tokyo
  access-team-domain:
    description: Cloudflare Access team domain (team.cloudflareaccess.com)
    default: ""
  access-aud:
    description: Cloudflare Access application audience
    default: ""
  allow-config-updates:
    description: Allow intentional changes to existing Worker settings after reviewing the configuration
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: "26.13.1"
    - name: Install ichiza web
      run: npm ci
      shell: bash
      working-directory: ${{ github.action_path }}/../../web
    - name: Deploy Worker
      run: |
        : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required}"
        : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is required}"
        : "${ICHIZA_GITHUB_TOKEN:?ICHIZA_GITHUB_TOKEN is required}"

        repository="$INPUT_REPOSITORY"
        if [ -z "$repository" ]; then
          repository="$GITHUB_REPOSITORY"
        fi
        case "$INPUT_ALLOW_CONFIG_UPDATES" in
          true|false) ;;
          *) echo "::error::allow-config-updates must be true or false"; exit 1 ;;
        esac

        umask 077
        config_file=""
        secrets_file=""
        trap 'rm -f "$config_file" "$secrets_file"' EXIT
        # Keep the config beside wrangler.jsonc so relative entry points still resolve.
        config_file=$(mktemp ./wrangler.deploy.XXXXXX.json)
        secrets_file=$(mktemp)
        DEPLOY_CONFIG="$config_file" SECRETS_FILE="$secrets_file" DEPLOY_REPOSITORY="$repository" node --input-type=module <<'NODE'
        import { readFileSync, writeFileSync } from 'node:fs'
        const env = process.env
        const config = JSON.parse(readFileSync('wrangler.jsonc', 'utf8'))
        const members = JSON.parse(env.INPUT_MEMBERS)
        if (!Array.isArray(members)) throw new Error('members must be an array')
        new Intl.DateTimeFormat('en-US', {timeZone: env.INPUT_TIMEZONE}).format()
        config.name = env.INPUT_WORKER_NAME
        config.vars = {
          ...config.vars,
          ICHIZA_REPOSITORY: env.DEPLOY_REPOSITORY,
          ICHIZA_MEMBERS: JSON.stringify(members),
          ICHIZA_TIMEZONE: env.INPUT_TIMEZONE,
          CF_ACCESS_TEAM_DOMAIN: env.INPUT_ACCESS_TEAM_DOMAIN,
          CF_ACCESS_AUD: env.INPUT_ACCESS_AUD,
        }
        writeFileSync(env.DEPLOY_CONFIG, JSON.stringify(config))
        writeFileSync(env.SECRETS_FILE, JSON.stringify({ICHIZA_GITHUB_TOKEN: env.ICHIZA_GITHUB_TOKEN}))
        NODE

        deploy_args=(--config "$config_file" --secrets-file "$secrets_file")
        if [ "$INPUT_ALLOW_CONFIG_UPDATES" = "false" ]; then
          deploy_args+=(--strict)
        fi
        npx --no-install wrangler deploy "${deploy_args[@]}"
      shell: bash
      working-directory: ${{ github.action_path }}/../../web
      env:
        INPUT_WORKER_NAME: ${{ inputs.worker-name }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_MEMBERS: ${{ inputs.members }}
        INPUT_TIMEZONE: ${{ inputs.timezone }}
        INPUT_ACCESS_TEAM_DOMAIN: ${{ inputs.access-team-domain }}
        INPUT_ACCESS_AUD: ${{ inputs.access-aud }}
        INPUT_ALLOW_CONFIG_UPDATES: ${{ inputs.allow-config-updates }}
        WRANGLER_SEND_METRICS: "false"
