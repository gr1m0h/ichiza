name: ichiza new
description: Scaffold a new event (event.yaml + tasks.yaml + issues) and open a PR
inputs:
  slug: { description: event slug, required: true }
  title: { description: event title, required: true }
  date: { description: "event date YYYY-MM-DD", required: true }
  mode:
    description: onsite | hybrid | online
    default: onsite
  lifecycle:
    description: "lifecycle template path (default: ichiza.yaml lifecycle)"
    default: ""
  create-issues:
    description: also create GitHub issues via gh
    default: "true"
  version:
    description: ichiza version
    default: latest
runs:
  using: composite
  steps:
    - uses: gr1m0h/ichiza/actions/setup@v0
      with:
        version: ${{ inputs.version }}
    # inputs はシェルへ直接展開せず env 経由で渡す（script injection 対策）
    - run: |
        ichiza new \
          --slug "$INPUT_SLUG" \
          --title "$INPUT_TITLE" \
          --date "$INPUT_DATE" \
          --mode "$INPUT_MODE" \
          ${INPUT_LIFECYCLE:+--lifecycle "$INPUT_LIFECYCLE"} \
          $([ "$INPUT_ISSUES" = "true" ] && echo --issues)
      shell: bash
      env:
        INPUT_SLUG: ${{ inputs.slug }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_DATE: ${{ inputs.date }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_LIFECYCLE: ${{ inputs.lifecycle }}
        INPUT_ISSUES: ${{ inputs.create-issues }}
        GH_TOKEN: ${{ env.GH_TOKEN }}
    - run: |
        git config user.name "ichiza[bot]"
        git config user.email "ichiza-bot@users.noreply.github.com"
        branch="ichiza/new-${INPUT_SLUG}"
        git checkout -b "$branch"
        git add events/
        git commit -m "ichiza new: ${INPUT_TITLE}"
        git push -u origin "$branch"
        gh pr create --fill --title "旗揚げ: ${INPUT_TITLE}" \
          --body "Generated by ichiza new. event.yaml を確認・追記してマージしてください。"
      shell: bash
      env:
        INPUT_SLUG: ${{ inputs.slug }}
        INPUT_TITLE: ${{ inputs.title }}
        GH_TOKEN: ${{ env.GH_TOKEN }}
