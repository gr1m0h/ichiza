name: ichiza new
description: Scaffold a new event (event.yaml + tasks.yaml + issues) and open a PR
inputs:
  slug: { description: event slug, required: true }
  title: { description: event title, required: true }
  date: { description: "event date YYYY-MM-DD", required: true }
  mode:
    description: onsite | hybrid | online
    default: onsite
  lifecycle:
    description: "lifecycle template path (default: ichiza.yaml lifecycle)"
    default: ""
  create-issues:
    description: also create GitHub issues via gh
    default: "true"
  version:
    description: ichiza version
    default: latest
runs:
  using: composite
  steps:
    - uses: gr1m0h/ichiza/actions/setup@v0
      with:
        version: ${{ inputs.version }}
    # Pass inputs via env instead of expanding them into the shell (script injection guard)
    - run: |
        ichiza new \
          --slug "$INPUT_SLUG" \
          --title "$INPUT_TITLE" \
          --date "$INPUT_DATE" \
          --mode "$INPUT_MODE" \
          ${INPUT_LIFECYCLE:+--lifecycle "$INPUT_LIFECYCLE"} \
          $([ "$INPUT_ISSUES" = "true" ] && echo --issues)
      shell: bash
      env:
        INPUT_SLUG: ${{ inputs.slug }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_DATE: ${{ inputs.date }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_LIFECYCLE: ${{ inputs.lifecycle }}
        INPUT_ISSUES: ${{ inputs.create-issues }}
        GH_TOKEN: ${{ env.GH_TOKEN }}
    # connpass has no write API: emit a paste-ready page draft instead
    # (copy the previous event on connpass → paste this → publish)
    - run: |
        {
          echo "## 募集ページ本文（コピペ用）"
          echo ""
          echo '````markdown'
          ichiza registry --slug "$INPUT_SLUG"
          echo '````'
        } >> "$GITHUB_STEP_SUMMARY"
      shell: bash
      env:
        INPUT_SLUG: ${{ inputs.slug }}
    - run: |
        git config user.name "ichiza[bot]"
        git config user.email "ichiza-bot@users.noreply.github.com"
        branch="ichiza/new-${INPUT_SLUG}"
        git checkout -b "$branch"
        git add events/
        git commit -m "ichiza new: ${INPUT_TITLE}"
        git push -u origin "$branch"
        pr_title="イベント作成: ${INPUT_TITLE}"
        pr_body="Generated by ichiza new. event.yaml を確認・追記してマージしてください。"
        # When Actions is not allowed to create PRs (the default for personal accounts),
        # don't fail — emit a prefilled manual PR link to the job summary instead
        if out=$(gh pr create --fill --title "$pr_title" --body "$pr_body" 2>&1); then
          echo "### イベント作成 PR: ${out}" >> "$GITHUB_STEP_SUMMARY"
        elif grep -q "not permitted to create or approve pull requests" <<<"$out"; then
          enc_title=$(jq -rn --arg v "$pr_title" '$v|@uri')
          enc_body=$(jq -rn --arg v "$pr_body" '$v|@uri')
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${branch}?expand=1&title=${enc_title}&body=${enc_body}"
          {
            echo "### ⚠️ PR の自動作成はスキップされました（ブランチは push 済み）"
            echo ""
            echo "このリポジトリでは GitHub Actions による PR 作成が許可されていません。"
            echo ""
            echo "**[→ ここから PR を作成](${url})**（タイトル・本文は入力済み）"
            echo ""
            echo "次回から自動化するには（初回のみ・どちらか一方）:"
            echo "- Settings → Actions → General → Workflow permissions → **Allow GitHub Actions to create and approve pull requests** を有効化"
            echo "- \`gh api -X PUT repos/${GITHUB_REPOSITORY}/actions/permissions/workflow -f default_workflow_permissions=read -F can_approve_pull_request_reviews=true\`"
          } >> "$GITHUB_STEP_SUMMARY"
        else
          echo "$out" >&2
          exit 1
        fi
      shell: bash
      env:
        INPUT_SLUG: ${{ inputs.slug }}
        INPUT_TITLE: ${{ inputs.title }}
        GH_TOKEN: ${{ env.GH_TOKEN }}
