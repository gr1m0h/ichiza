name: ichiza registry
description: Render the registration page draft to the job summary for copy-paste
inputs:
  slug:
    description: render the full page draft for events/<slug>
    required: true
  version:
    description: ichiza version
    default: latest
runs:
  using: composite
  steps:
    - uses: gr1m0h/ichiza/actions/setup@v0
      with:
        version: ${{ inputs.version }}
    # Pass inputs via env instead of expanding them into the shell (script injection guard)
    - run: |
        {
          echo "## 募集ページ原稿（コピペ用）"
          echo ""
          echo '````markdown'
          ichiza registry --slug "$INPUT_SLUG"
          echo '````'
        } >> "$GITHUB_STEP_SUMMARY"
      shell: bash
      env:
        INPUT_SLUG: ${{ inputs.slug }}
